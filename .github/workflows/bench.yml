name: bench

on:
  workflow_dispatch:
    inputs:
      filter:
        description: BenchmarkDotNet --filter glob
        required: false
        default: '*'

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Benchmarks
        env:
          FILTER: ${{ inputs.filter }}
        run: dotnet run --project bench/Tralys.Ecs.Benchmarks -c Release -- --filter "$FILTER" --artifacts artifacts/bench

      - name: Spikes
        env:
          FILTER: ${{ inputs.filter }}
        run: dotnet run --project bench/Tralys.Ecs.Spikes -c Release -- --filter "$FILTER" --artifacts artifacts/spikes

      - uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: artifacts/
          retention-days: 90
