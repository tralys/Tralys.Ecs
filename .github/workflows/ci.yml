name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      version:
        description: Package version; empty packs VersionPrefix with a ci suffix
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Format
        if: matrix.rid == 'linux-x64'
        run: |
          dotnet tool restore
          dotnet csharpier check .

      - name: Version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            echo "VERSION_ARGS=-p:Version=$VERSION" >> "$GITHUB_ENV"
          else
            echo "VERSION_ARGS=-p:VersionSuffix=ci.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - run: dotnet restore Tralys.Ecs.slnx

      - run: dotnet build Tralys.Ecs.slnx -c Release --no-restore "$VERSION_ARGS"

      - name: Test
        run: |
          for project in tests/Tralys.Ecs.Tests tests/Tralys.Ecs.Generators.Tests tests/Tralys.Ecs.Scheduling.Tests; do
            echo "::group::$project"
            dotnet run --project "$project" -c Release --no-build
            echo "::endgroup::"
          done

      # IlcTreatWarningsAsErrors turns any IL2xxx/IL3xxx trim or AOT warning into a failed publish.
      - name: AOT smoke
        run: |
          dotnet publish tests/Tralys.Ecs.Aot.Smoke -c Release
          tests/Tralys.Ecs.Aot.Smoke/bin/Release/net11.0/${{ matrix.rid }}/publish/Tralys.Ecs.Aot.Smoke

      - name: Pack
        if: matrix.rid == 'linux-x64'
        run: dotnet pack Tralys.Ecs.slnx -c Release --no-build -o artifacts/packages "$VERSION_ARGS"

      - uses: actions/upload-artifact@v7
        if: matrix.rid == 'linux-x64'
        with:
          name: packages
          path: artifacts/packages/
          retention-days: 7
